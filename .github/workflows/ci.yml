name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: madrnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/madrnext_test
      AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      MEDIA_TOKEN_TTL_SECONDS: "120"
      MAX_CONCURRENT_SESSIONS: "3"
      MAX_CONCURRENT_PLAYBACKS: "2"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply schema to test database
        run: npx prisma migrate deploy

      - name: Vendor pdf.js worker
        run: bash scripts/dev/copy-pdf-worker.sh

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"
